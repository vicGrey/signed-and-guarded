apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged-pod
  labels:
    app: bad-privileged-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: app
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
