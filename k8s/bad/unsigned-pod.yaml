apiVersion: v1
kind: Pod
metadata:
  name: unsigned-service-pod
  labels:
    app: unsigned-service
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  containers:
    - name: app
      image: ghcr.io/vicgrey/signed-and-guarded:v1.0.0-unsigned
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL
