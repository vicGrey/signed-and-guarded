apiVersion: v1
kind: Pod
metadata:
  name: bad-latest-pod
  labels:
    app: bad-latest-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: app
      image: busybox:latest
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
