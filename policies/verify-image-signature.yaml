apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: check-image-signature
  annotations:
    policies.kyverno.io/title: Verify Image Signatures with Sigstore Cosign
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Verifies that container images deployed from the project registry
      were cryptographically signed by the trusted GitHub Actions workflow
      on the main branch using Sigstore keyless OIDC provenance.
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-signature-github-oidc
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/vicgrey/signed-and-guarded*"
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/vicGrey/signed-and-guarded/.github/workflows/build-sign.yml@refs/heads/main"
                    rekor:
                      url: "https://rekor.sigstore.dev"
